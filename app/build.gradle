apply plugin: 'com.android.application'

android {
    compileSdkVersion 31
    
    if (project.hasProperty('android.buildToolsVersion')) {
        buildToolsVersion project.property('android.buildToolsVersion')
    } else {
        buildToolsVersion "30.0.3"
    }

    // Отключение оптимизации картинок, вызывающей ошибку mergeDebugResources
    aaptOptions {
        cruncherEnabled = false
        useNewCruncher = false
    }

    defaultConfig {
        applicationId "com.geminiapp.chat"
        minSdkVersion 1
        targetSdkVersion 31
        versionCode 10
        versionName "2.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    // TLS 1.2 на чистой Java для Android 1.0-4.0 (без Wolfius). Только core, без провайдера.
    compile 'com.madgag.spongycastle:core:1.58.0.0'
    // Чистый проект без сторонних библиотек и androidx
}